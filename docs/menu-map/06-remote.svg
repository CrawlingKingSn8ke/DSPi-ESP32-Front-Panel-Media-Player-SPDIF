<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1590" viewBox="0 0 1400 1590" font-family="Segoe UI, Arial, sans-serif"><title>Remote &amp; Shortcuts</title><desc>Menu reference for DSPi ESP32 Front Panel v1.4.0. EDIT denotes editable values, READ information, CONFIRM guarded actions. SYSTEM / REMOTE</desc><rect width="1400" height="1590" fill="#080d12"/><text x="48" y="42" fill="#40d9e7" font-size="17" font-weight="600">DSPi ESP32 FRONT PANEL</text><text x="48" y="91" fill="#edf5fa" font-size="40" font-weight="600">Remote &amp; Shortcuts</text><text x="48" y="122" fill="#a7bdcc" font-size="15" font-weight="400">SYSTEM / REMOTE</text><text x="1191.0" y="42" fill="#a7bdcc" font-size="16" font-weight="400">v1.4.0 · menu reference</text><path d="M48,143 H1352 V143" fill="none" stroke="#294252" stroke-width="1.5"/><text x="67" y="186" fill="#40d9e7" font-size="23" font-weight="600">Remote</text><path d="M73,215 H82 V215" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="223" fill="#edf5fa" font-size="21" font-weight="400">Connected / Reconnecting</text><text x="87" y="248" fill="#40d9e7" font-size="11" font-weight="600">READ</text><text x="87" y="266" fill="#a7bdcc" font-size="17" font-weight="400">Displays the saved device name; Not paired</text><text x="87" y="289" fill="#a7bdcc" font-size="17" font-weight="400">when no profile exists.</text><path d="M73,320 H82 V320" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="328" fill="#40d9e7" font-size="23" font-weight="600">Find Remote</text><text x="87" y="356" fill="#a7bdcc" font-size="17" font-weight="400">Available without a saved profile, when scanning</text><text x="87" y="379" fill="#a7bdcc" font-size="17" font-weight="400">is safe.</text><path d="M93,403 H102 V403" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="411" fill="#edf5fa" font-size="21" font-weight="400">Scan → choose remote → pair</text><path d="M92,399 H92 V427" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M73,454 H82 V454" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="462" fill="#edf5fa" font-size="21" font-weight="400">Key Map</text><text x="87" y="490" fill="#a7bdcc" font-size="17" font-weight="400">Available with a saved remote; full action list in</text><text x="87" y="513" fill="#a7bdcc" font-size="17" font-weight="400">the next column.</text><path d="M73,544 H82 V544" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="552" fill="#edf5fa" font-size="21" font-weight="400">D-pad Shortcuts</text><text x="87" y="580" fill="#a7bdcc" font-size="17" font-weight="400">Full options in the right column.</text><path d="M73,611 H82 V611" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="619" fill="#edf5fa" font-size="21" font-weight="400">Restore Defaults</text><text x="87" y="644" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><text x="87" y="662" fill="#a7bdcc" font-size="17" font-weight="400">Restore mapping / shortcut defaults.</text><path d="M73,693 H82 V693" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="701" fill="#edf5fa" font-size="21" font-weight="400">Remove Remote</text><text x="87" y="726" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><text x="87" y="744" fill="#a7bdcc" font-size="17" font-weight="400">Confirm removal of the saved remote and bond.</text><path d="M72,211 H72 V755" fill="none" stroke="#294252" stroke-width="1.5"/><text x="67" y="806" fill="#40d9e7" font-size="23" font-weight="600">Learn a button</text><text x="67" y="834" fill="#a7bdcc" font-size="17" font-weight="400">A mapped key is shown in accent colour; None is</text><text x="67" y="857" fill="#a7bdcc" font-size="17" font-weight="400">shown when unset.</text><path d="M73,881 H82 V881" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="889" fill="#edf5fa" font-size="21" font-weight="400">Choose Key Map action</text><path d="M73,925 H82 V925" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="933" fill="#edf5fa" font-size="21" font-weight="400">Press then release remote button</text><path d="M73,969 H82 V969" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="977" fill="#edf5fa" font-size="21" font-weight="400">Mapping stored</text><path d="M72,877 H72 V993" fill="none" stroke="#294252" stroke-width="1.5"/><text x="511" y="186" fill="#40d9e7" font-size="23" font-weight="600">Key Map</text><path d="M517,215 H526 V215" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="223" fill="#edf5fa" font-size="21" font-weight="400">Context Up</text><text x="531" y="248" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M517,274 H526 V274" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="282" fill="#edf5fa" font-size="21" font-weight="400">Context Down</text><text x="531" y="307" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M517,333 H526 V333" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="341" fill="#edf5fa" font-size="21" font-weight="400">Context Left</text><text x="531" y="366" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M517,392 H526 V392" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="400" fill="#edf5fa" font-size="21" font-weight="400">Context Right</text><text x="531" y="425" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M517,451 H526 V451" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="459" fill="#edf5fa" font-size="21" font-weight="400">Select</text><text x="531" y="484" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M517,510 H526 V510" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="518" fill="#edf5fa" font-size="21" font-weight="400">Back</text><text x="531" y="543" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M517,569 H526 V569" fill="none" stroke="#294252" s