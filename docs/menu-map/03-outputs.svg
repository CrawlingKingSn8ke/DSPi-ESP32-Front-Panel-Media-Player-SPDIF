<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1903" viewBox="0 0 1400 1903" font-family="Segoe UI, Arial, sans-serif"><title>Outputs, EQ &amp; Routing</title><desc>Menu reference for DSPi ESP32 Front Panel v1.4.0. EDIT denotes editable values, READ information, CONFIRM guarded actions. MAIN MENU / OUTPUTS</desc><rect width="1400" height="1903" fill="#080d12"/><text x="48" y="42" fill="#40d9e7" font-size="17" font-weight="600">DSPi ESP32 FRONT PANEL</text><text x="48" y="91" fill="#edf5fa" font-size="40" font-weight="600">Outputs, EQ &amp; Routing</text><text x="48" y="122" fill="#a7bdcc" font-size="15" font-weight="400">MAIN MENU / OUTPUTS</text><text x="1191.0" y="42" fill="#a7bdcc" font-size="16" font-weight="400">v1.4.0 · menu reference</text><path d="M48,143 H1352 V143" fill="none" stroke="#294252" stroke-width="1.5"/><text x="67" y="186" fill="#40d9e7" font-size="23" font-weight="600">Outputs</text><path d="M73,215 H82 V215" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="223" fill="#40d9e7" font-size="23" font-weight="600">Choose named output</text><text x="87" y="251" fill="#a7bdcc" font-size="17" font-weight="400">Disabled outputs stay listed; labels and output</text><text x="87" y="274" fill="#a7bdcc" font-size="17" font-weight="400">count follow DSPi.</text><path d="M93,298 H102 V298" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="306" fill="#edf5fa" font-size="21" font-weight="400">Mute</text><text x="107" y="331" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M93,357 H102 V357" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="365" fill="#edf5fa" font-size="21" font-weight="400">Gain</text><text x="107" y="390" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="107" y="408" fill="#a7bdcc" font-size="17" font-weight="400">0.01 dB editor; two-decimal display.</text><path d="M93,439 H102 V439" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="447" fill="#edf5fa" font-size="21" font-weight="400">Delay</text><text x="107" y="472" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M93,498 H102 V498" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="506" fill="#edf5fa" font-size="21" font-weight="400">EQ / Crossover</text><text x="107" y="534" fill="#a7bdcc" font-size="17" font-weight="400">Full editor shown in the next column.</text><path d="M93,565 H102 V565" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="573" fill="#edf5fa" font-size="21" font-weight="400">Routing</text><text x="107" y="601" fill="#a7bdcc" font-size="17" font-weight="400">Individual input routes or editable Mono L+R.</text><path d="M93,632 H102 V632" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="640" fill="#edf5fa" font-size="21" font-weight="400">Rename</text><text x="107" y="665" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="107" y="683" fill="#a7bdcc" font-size="17" font-weight="400">Native DSPi channel name.</text><path d="M93,714 H102 V714" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="722" fill="#edf5fa" font-size="21" font-weight="400">Enabled</text><text x="107" y="747" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><text x="107" y="765" fill="#a7bdcc" font-size="17" font-weight="400">Explicit hardware-change confirmation.</text><path d="M93,796 H102 V796" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="804" fill="#40d9e7" font-size="23" font-weight="600">Copy Parameters</text><path d="M113,833 H122 V833" fill="none" stroke="#294252" stroke-width="1.5"/><text x="127" y="841" fill="#edf5fa" font-size="21" font-weight="400">Copy To → destination</text><path d="M113,877 H122 V877" fill="none" stroke="#294252" stroke-width="1.5"/><text x="127" y="885" fill="#40d9e7" font-size="23" font-weight="600">Preview</text><path d="M133,914 H142 V914" fill="none" stroke="#294252" stroke-width="1.5"/><text x="147" y="922" fill="#edf5fa" font-size="21" font-weight="400">From / Replace</text><text x="147" y="947" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M133,973 H142 V973" fill="none" stroke="#294252" stroke-width="1.5"/><text x="147" y="981" fill="#edf5fa" font-size="21" font-weight="400">EQ / Crossover</text><text x="147" y="1006" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M133,1032 H142 V1032" fill="none" stroke="#294252" stroke-width="1.5"/><text x="147" y="1040" fill="#edf5fa" font-size="21" font-weight="400">Gain / Delay</text><text x="147" y="1065" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M133,1091 H142 V1091" fill="none" stroke="#294252" stroke-width="1.5"/><text x="147" y="1099" fill="#edf5fa" font-size="21" font-weight="400">Mute</text><text x="147" y="1124" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M132,910 H132 V1130" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M113,1157 H122 V1157" fill="none" stroke="#294252" stroke-width="1.5"/><text x="127" y="1165" fill="#edf5fa" font-size="21" font-weight="400">Confirm copy</text><text x="127" y="1190" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><text x="127" y="1208" fill="#a7bdcc" font-size="17" font-weight="400">Copies all 10 EQ bands + 4 XO slots, gain,</text><text x="127" y="1231" fill="#a7bdcc" font-size="17" font-weight="400">delay and mute.</text><path d="M112,829 H112 V1242" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M92,294 H92 V1249" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M72,211 H72 V1256" fill="none" stroke="#294252" stroke-width="1.5"/><text x="511" y="186" fill="#40d9e7" font-size="23" font-weight="600">EQ / Crossover</text><path d="M517,215 H526 V215" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="223" fill="#40d9e7" font-size="23" font-weight="600">Bands</text><path d="M537,252 H546 V252" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="260" fill="#40d9e7" font-size="23" font-weight="600">Band 1 … Band 10</text><path d="M557,289 H566 V289" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="297" fill="#edf5fa" font-size="21" font-weight="400">Enabled</text><text x="571" y="322" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M557,348 H566 V348" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="356" fill="#edf5fa" font-size="21" font-weight="400">Type</text><text x="571" y="381" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M557,407 H566 V407" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="415" fill="#edf5fa" font-size="21" font-weight="400">Frequency / Gain / Q</text><text x="571" y="440" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="571" y="458" fill="#a7bdcc" font-size="17" font-weight="400">Only parameters used by the chosen filter</text><text x="571" y="481" fill="#a7bdcc" font-size="17" font-weight="400">are shown.</text><path d="M557,512 H566 V512" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="520" fill="#edf5fa" font-size="21" font-weight="400">f0 / Q0 / fp / Qp</text><text x="571" y="545" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="571" y="563" fill="#a7bdcc" font-size="17" font-weight="400">Linkwitz Transform uses these four</text><text x="571" y="586" fill="#a7bdcc" font-size="17" font-weight="400">parameters instead.</text><path d="M556,285 H556 V597" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M536,248 H536 V604" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M517,631 H526 V631" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="639" fill="#40d9e7" font-size="23" font-weight="600">Crossover</text><path d="M537,668 H546 V668" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="676" fill="#40d9e7" font-size="23" font-weight="600">XO 1 … XO 4</text><path d="M557,705 H566 V705" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="713" fill="#edf5fa" font-size="21" font-weight="400">Enabled</text><text x="571" y="738" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M557,764 H566 V764" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="772" fill="#edf5fa" font-size="21" font-weight="400">Direction</text><text x="571" y="797" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="571" y="815" fill="#a7bdcc" font-size="17" font-weight="400">Low Pass / High Pass</text><path d="M557,846 H566 V846" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="854" fill="#edf5fa" font-size="21" font-weight="400">Family</text><text x="571" y="879" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="571" y="897" fill="#a7bdcc" font-size="17" font-weight="400">Linkwitz / Butterworth / Bessel</text><path d="M557,928 H566 V928" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="936" fill="#edf5fa" font-size="21" font-weight="400">Slope</text><text x="571" y="961" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M557,987 H566 V987" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="995" fill="#edf5fa" font-size="21" font-weight="400">Frequency</text><text x="571" y="1020" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M556,701 H556 V1026" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M536,664 H536 V1033" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M516,211 H516 V1040" fill="none" stroke="#294252" stroke-width="1.5"/><text x="511" y="1091" fill="#40d9e7" font-size="23" font-weight="600">Routing</text><path d="M517,1120 H526 V1120" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="1128" fill="#40d9e7" font-size="23" font-weight="600">Choose logical input</text><path d="M537,1157 H546 V1157" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="1165" fill="#edf5fa" font-size="21" font-weight="400">Enabled</text><text x="551" y="1190" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M537,1216 H546 V1216" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="1224" fill="#edf5fa" font-size="21" font-weight="400">Gain</text><text x="551" y="1249" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="551" y="1267" fill="#a7bdcc" font-size="17" font-weight="400">0.01 dB</text><path d="M537,1298 H546 V1298" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="1306" fill="#edf5fa" font-size="21" font-weight="400">Invert</text><text x="551" y="1331" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M536,1153 H536 V1337" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M517,1364 H526 V1364" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="1372" fill="#40d9e7" font-size="23" font-weight="600">Sum Mode</text><path d="M537,1401 H546 V1401" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="1409" fill="#edf5fa" font-size="21" font-weight="400">Choose input pair</text><text x="551" y="1437" fill="#a7bdcc" font-size="17" font-weight="400">Only shown when more than two logical</text><text x="551" y="1460" fill="#a7bdcc" font-size="17" font-weight="400">inputs are active.</text><path d="M537,1491 H546 V1491" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="1499" fill="#edf5fa" font-size="21" font-weight="400">Left</text><text x="551" y="1524" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="551" y="1542" fill="#a7bdcc" font-size="17" font-weight="400">Starts from the current route gain.</text><path d="M537,1573 H546 V1573" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="1581" fill="#edf5fa" font-size="21" font-weight="400">Right</text><text x="551" y="1606" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="551" y="1624" fill="#a7bdcc" font-size="17" font-weight="400">Starts from the current route gain.</text><path d="M537,1655 H546 V1655" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="1663" fill="#edf5fa" font-size="21" font-weight="400">Mono L+R → Save</text><text x="551" y="1688" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><text x="551" y="1706" fill="#a7bdcc" font-size="17" font-weight="400">Uses your gains exactly; no automatic</text><text x="551" y="1729" fill="#a7bdcc" font-size="17" font-weight="400">attenuation.</text><path d="M536,1397 H536 V1740" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M516,1116 H516 V1747" fill="none" stroke="#294252" stroke-width="1.5"/><text x="955" y="186" fill="#40d9e7" font-size="23" font-weight="600">Quick Controls</text><path d="M961,215 H970 V215" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="223" fill="#edf5fa" font-size="21" font-weight="400">Speakers</text><text x="975" y="248" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="975" y="266" fill="#a7bdcc" font-size="17" font-weight="400">Mute/unmute assigned left + right speaker</text><text x="975" y="289" fill="#a7bdcc" font-size="17" font-weight="400">outputs.</text><path d="M961,320 H970 V320" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="328" fill="#edf5fa" font-size="21" font-weight="400">Subwoofer</text><text x="975" y="353" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="975" y="371" fill="#a7bdcc" font-size="17" font-weight="400">Mute/unmute assigned sub outputs.</text><path d="M961,402 H970 V402" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="410" fill="#edf5fa" font-size="21" font-weight="400">Sub Level</text><text x="975" y="435" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="975" y="453" fill="#a7bdcc" font-size="17" font-weight="400">Single-output gain, or a relative trim for multiple</text><text x="975" y="476" fill="#a7bdcc" font-size="17" font-weight="400">subs.</text><path d="M961,507 H970 V507" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="515" fill="#edf5fa" font-size="21" font-weight="400">Balance</text><text x="975" y="540" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="975" y="558" fill="#a7bdcc" font-size="17" font-weight="400">Relative left/right level adjustment.</text><path d="M960,211 H960 V569" fill="none" stroke="#294252" stroke-width="1.5"/><text x="955" y="620" fill="#40d9e7" font-size="23" font-weight="600">Setup</text><path d="M961,649 H970 V649" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="657" fill="#40d9e7" font-size="23" font-weight="600">Speaker Groups</text><text x="975" y="685" fill="#a7bdcc" font-size="17" font-weight="400">Manual roles; initially Unassigned. Does not</text><text x="975" y="708" fill="#a7bdcc" font-size="17" font-weight="400">change routing or GPIO.</text><path d="M981,732 H990 V732" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="740" fill="#40d9e7" font-size="23" font-weight="600">Left</text><path d="M1001,769 H1010 V769" fill="none" stroke="#294252" stroke-width="1.5"/><text x="1015" y="777" fill="#edf5fa" font-size="21" font-weight="400">Assign outputs</text><text x="1015" y="802" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M1000,765 H1000 V808" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M981,835 H990 V835" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="843" fill="#40d9e7" font-size="23" font-weight="600">Right</text><path d="M1001,872 H1010 V872" fill="none" stroke="#294252" stroke-width="1.5"/><text x="1015" y="880" fill="#edf5fa" font-size="21" font-weight="400">Assign outputs</text><text x="1015" y="905" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M1000,868 H1000 V911" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M981,938 H990 V938" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="946" fill="#40d9e7" font-size="23" font-weight="600">Subs</text><path d="M1001,975 H1010 V975" fill="none" stroke="#294252" stroke-width="1.5"/><text x="1015" y="983" fill="#edf5fa" font-size="21" font-weight="400">Assign outputs</text><text x="1015" y="1008" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M1000,971 H1000 V1014" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M980,728 H980 V1021" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M961,1048 H970 V1048" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="1056" fill="#edf5fa" font-size="21" font-weight="400">Restore Saved</text><text x="975" y="1081" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><text x="975" y="1099" fill="#a7bdcc" font-size="17" font-weight="400">Only available for confirmed saved quick-control</text><text x="975" y="1122" fill="#a7bdcc" font-size="17" font-weight="400">adjustments.</text><path d="M960,645 H960 V1133" fill="none" stroke="#294252" stroke-width="1.5"/><text x="955" y="1184" fill="#40d9e7" font-size="23" font-weight="600">Copy / Sum boundaries</text><path d="M961,1213 H970 V1213" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="1221" fill="#edf5fa" font-size="21" font-weight="400">Copy leaves routing and GPIO alone</text><text x="975" y="1246" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M961,1272 H970 V1272" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="1280" fill="#edf5fa" font-size="21" font-weight="400">Sum leaves output gain alone</text><text x="975" y="1305" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M961,1331 H970 V1331" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="1339" fill="#edf5fa" font-size="21" font-weight="400">Save Preset is separate</text><text x="975" y="1364" fill="#40d9e7" font-size="11" font-weight="600">READ</text><text x="975" y="1382" fill="#a7bdcc" font-size="17" font-weight="400">Live parameter changes are not automatically</text><text x="975" y="1405" fill="#a7bdcc" font-size="17" font-weight="400">written to a DSPi preset.</text><path d="M960,1209 H960 V1416" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M48,1815 H1352 V1815" fill="none" stroke="#294252" stroke-width="1.5"/><text x="48" y="1841" fill="#a7bdcc" font-size="16" font-weight="400">Sum replaces routes to the chosen output with the selected pair. An interrupted Copy or Sum can leave a partial change; inspect the target.</text></svg>