981,380 H990 V380" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="388" fill="#edf5fa" font-size="21" font-weight="400">Short Name</text><text x="995" y="413" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="995" y="431" fill="#a7bdcc" font-size="17" font-weight="400">Compact Home label.</text><path d="M981,462 H990 V462" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="470" fill="#edf5fa" font-size="21" font-weight="400">Show in Menu</text><text x="995" y="495" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="995" y="513" fill="#a7bdcc" font-size="17" font-weight="400">At least one available source must remain</text><text x="995" y="536" fill="#a7bdcc" font-size="17" font-weight="400">visible.</text><path d="M981,567 H990 V567" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="575" fill="#edf5fa" font-size="21" font-weight="400">Position</text><text x="995" y="600" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="995" y="618" fill="#a7bdcc" font-size="17" font-weight="400">Order in the panel source selector.</text><path d="M981,649 H990 V649" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="657" fill="#edf5fa" font-size="21" font-weight="400">Reset Name</text><path d="M980,294 H980 V673" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M960,257 H960 V680" fill="none" stroke="#294252" stroke-width="1.5"/><text x="955" y="731" fill="#40d9e7" font-size="23" font-weight="600">Spectrum / idle behaviour</text><path d="M961,760 H970 V760" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="768" fill="#edf5fa" font-size="21" font-weight="400">Two channels shown at a time</text><text x="975" y="793" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M961,819 H970 V819" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="827" fill="#edf5fa" font-size="21" font-weight="400">Selection follows matrix a