xt><text x="511" y="995" fill="#a7bdcc" font-size="17" font-weight="400">Independent / With Preset</text><text x="955" y="186" fill="#40d9e7" font-size="23" font-weight="600">ADAT</text><text x="955" y="214" fill="#a7bdcc" font-size="17" font-weight="400">Only available on compatible RP2350 firmware.</text><path d="M961,238 H970 V238" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="246" fill="#edf5fa" font-size="21" font-weight="400">Input Enabled</text><text x="975" y="271" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M961,297 H970 V297" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="305" fill="#edf5fa" font-size="21" font-weight="400">Input Pin</text><text x="975" y="330" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M961,356 H970 V356" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="364" fill="#edf5fa" font-size="21" font-weight="400">Input Clock</text><text x="975" y="389" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M961,415 H970 V415" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="423" fill="#edf5fa" font-size="21" font-weight="400">Output Enabled</text><text x="975" y="448" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M961,474 H970 V474" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="482" fill="#edf5fa" font-size="21" font-weight="400">Output Pin</text><text x="975" y="507" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M961,533 H970 V533" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="541" fill="#edf5fa" font-size="21" font-weight="400">Input State</text><text x="975" y="566" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M961,592 H970 V592" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="600" fill="#edf5fa" font-size="21" font-weight="400">Output State</text><text x="975" y="625" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M960,234 H960 V631" fill="none" stroke="#294252" stroke-width="1.5"/><text x="955" y="682" fill="#40d9e7" font-size="23" font-weight="600">Hardware safeguards</text><path d="M961,711 H970 V711" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="719" fill="#edf5fa" font-size="21" font-weight="400">Confirmed DSPi identity required</text><text x="975" y="744" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M961,770 H970 V770" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="778" fill="#edf5fa" font-size="21" font-weight="400">GPIO validity is checked</text><text x="975" y="803" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M961,829 H970 V829" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="837" fill="#edf5fa" font-size="21" font-weight="400">Protected UART pins excluded</text><text x="975" y="862" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M961,888 H970 V888" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="896" fill="#edf5fa" font-size="21" font-weight="400">Check pin conflicts in Console</text><text x="975" y="921" fill="#40d9e7" font-size="11" font-weight="600">READ</text><text x="975" y="939" fill="#a7bdcc" font-size="17" font-weight="400">Verify all existing input/output/clock</text><text x="975" y="962" fill="#a7bdcc" font-size="17" font-weight="400">assignments and actual wiring.</text><path d="M961,993 H970 V993" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="1001" fill="#edf5fa" font-size="21" font-weight="400">Playback may be stopped</text><text x="975" y="1026" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M961,1052 H970 V1052" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="1060" fill="#edf5fa" font-size="21" font-weight="400">Current → Proposed → confirm</text><text x="975" y="1085" fill="#40d9e7" font-size="11" font-w