<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2055" viewBox="0 0 1400 2055" font-family="Segoe UI, Arial, sans-serif"><title>Input, Music &amp; Preset</title><desc>Menu reference for DSPi ESP32 Front Panel v1.4.0. EDIT denotes editable values, READ information, CONFIRM guarded actions. MAIN MENU / INPUT · MUSIC · PRESET</desc><rect width="1400" height="2055" fill="#080d12"/><text x="48" y="42" fill="#40d9e7" font-size="17" font-weight="600">DSPi ESP32 FRONT PANEL</text><text x="48" y="91" fill="#edf5fa" font-size="40" font-weight="600">Input, Music &amp; Preset</text><text x="48" y="122" fill="#a7bdcc" font-size="15" font-weight="400">MAIN MENU / INPUT · MUSIC · PRESET</text><text x="1191.0" y="42" fill="#a7bdcc" font-size="16" font-weight="400">v1.4.0 · menu reference</text><path d="M48,143 H1352 V143" fill="none" stroke="#294252" stroke-width="1.5"/><text x="67" y="186" fill="#40d9e7" font-size="23" font-weight="600">Input</text><path d="M73,215 H82 V215" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="223" fill="#edf5fa" font-size="21" font-weight="400">Source</text><text x="87" y="248" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="87" y="266" fill="#a7bdcc" font-size="17" font-weight="400">USB · S/PDIF 1–4 · I2S · ADAT, where available</text><path d="M73,297 H82 V297" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="305" fill="#edf5fa" font-size="21" font-weight="400">Custom source labels</text><text x="87" y="330" fill="#40d9e7" font-size="11" font-weight="600">READ</text><text x="87" y="348" fill="#a7bdcc" font-size="17" font-weight="400">Set full/short names, visibility and order in</text><text x="87" y="371" fill="#a7bdcc" font-size="17" font-weight="400">System → Inputs.</text><path d="M72,211 H72 V382" fill="none" stroke="#294252" stroke-width="1.5"/><text x="67" y="433" fill="#40d9e7" font-size="23" font-weight="600">Music</text><path d="M73,462 H82 V462" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="470" fill="#40d9e7" font-size="23" font-weight="600">Folders → tracks</text><text x="87" y="498" fill="#a7bdcc" font-size="17" font-weight="400">Folder and playing-track highlights follow the</text><text x="87" y="521" fill="#a7bdcc" font-size="17" font-weight="400">active track.</text><path d="M93,545 H102 V545" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="553" fill="#edf5fa" font-size="21" font-weight="400">Select a track</text><text x="107" y="581" fill="#a7bdcc" font-size="17" font-weight="400">Start playback and open Now Playing.</text><path d="M92,541 H92 V592" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M73,619 H82 V619" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="627" fill="#40d9e7" font-size="23" font-weight="600">Now Playing</text><text x="87" y="655" fill="#a7bdcc" font-size="17" font-weight="400">Available when a track is loaded; album artwork</text><text x="87" y="678" fill="#a7bdcc" font-size="17" font-weight="400">and track information.</text><path d="M93,702 H102 V702" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="710" fill="#edf5fa" font-size="21" font-weight="400">Play / Pause</text><text x="107" y="735" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M93,761 H102 V761" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="769" fill="#edf5fa" font-size="21" font-weight="400">Previous / Next track</text><text x="107" y="794" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M93,820 H102 V820" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="828" fill="#edf5fa" font-size="21" font-weight="400">Seek</text><text x="107" y="853" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="107" y="871" fill="#a7bdcc" font-size="17" font-weight="400">Uses the selected Seek Step.</text><path d="M92,698 H92 V882" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M73,909 H82 V909" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="917" fill="#40d9e7" font-size="23" font-weight="600">Playback Settings</text><path d="M93,946 H102 V946" fill="none" stroke="#294252" stroke-width="1.5"/><text x="107" y="954" fill="#edf5fa" font-size="21" font-weight="400">Seek Step</text><text x="107" y="979" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M92,942 H92 V985" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M73,1012 H82 V1012" fill="none" stroke="#294252" stroke-width="1.5"/><text x="87" y="1020" fill="#edf5fa" font-size="21" font-weight="400">Scan SD / Refresh SD</text><text x="87" y="1048" fill="#a7bdcc" font-size="17" font-weight="400">Or Check SD card when unavailable.</text><path d="M72,458 H72 V1059" fill="none" stroke="#294252" stroke-width="1.5"/><text x="511" y="186" fill="#40d9e7" font-size="23" font-weight="600">Preset</text><path d="M517,215 H526 V215" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="223" fill="#edf5fa" font-size="21" font-weight="400">P1 … P10</text><text x="531" y="251" fill="#a7bdcc" font-size="17" font-weight="400">Named and empty slots remain visible. Select an</text><text x="531" y="274" fill="#a7bdcc" font-size="17" font-weight="400">occupied slot to load.</text><path d="M517,305 H526 V305" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="313" fill="#edf5fa" font-size="21" font-weight="400">Hold Select for 5 seconds</text><text x="531" y="338" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><text x="531" y="356" fill="#a7bdcc" font-size="17" font-weight="400">Save current preset; playback is stopped when</text><text x="531" y="379" fill="#a7bdcc" font-size="17" font-weight="400">required.</text><path d="M517,410 H526 V410" fill="none" stroke="#294252" stroke-width="1.5"/><text x="531" y="418" fill="#40d9e7" font-size="23" font-weight="600">Preset Tools</text><path d="M537,447 H546 V447" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="455" fill="#edf5fa" font-size="21" font-weight="400">Save Changes</text><text x="551" y="480" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><text x="551" y="498" fill="#a7bdcc" font-size="17" font-weight="400">Save to the current occupied slot.</text><path d="M537,529 H546 V529" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="537" fill="#40d9e7" font-size="23" font-weight="600">Save As New</text><path d="M557,566 H566 V566" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="574" fill="#edf5fa" font-size="21" font-weight="400">Choose empty slot</text><path d="M557,610 H566 V610" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="618" fill="#40d9e7" font-size="23" font-weight="600">Preset Preview</text><path d="M577,647 H586 V647" fill="none" stroke="#294252" stroke-width="1.5"/><text x="591" y="655" fill="#edf5fa" font-size="21" font-weight="400">Destination</text><text x="591" y="680" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M577,706 H586 V706" fill="none" stroke="#294252" stroke-width="1.5"/><text x="591" y="714" fill="#edf5fa" font-size="21" font-weight="400">Name</text><text x="591" y="739" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M577,765 H586 V765" fill="none" stroke="#294252" stroke-width="1.5"/><text x="591" y="773" fill="#edf5fa" font-size="21" font-weight="400">Starting Point</text><text x="591" y="798" fill="#40d9e7" font-size="11" font-weight="600">READ</text><text x="591" y="816" fill="#a7bdcc" font-size="17" font-weight="400">Current settings.</text><path d="M577,847 H586 V847" fill="none" stroke="#294252" stroke-width="1.5"/><text x="591" y="855" fill="#edf5fa" font-size="21" font-weight="400">Output EQ / XO</text><text x="591" y="880" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M577,906 H586 V906" fill="none" stroke="#294252" stroke-width="1.5"/><text x="591" y="914" fill="#edf5fa" font-size="21" font-weight="400">Wiring / Limiter</text><text x="591" y="939" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M577,965 H586 V965" fill="none" stroke="#294252" stroke-width="1.5"/><text x="591" y="973" fill="#edf5fa" font-size="21" font-weight="400">Input PEQ / FX</text><text x="591" y="998" fill="#40d9e7" font-size="11" font-weight="600">READ</text><path d="M577,1024 H586 V1024" fill="none" stroke="#294252" stroke-width="1.5"/><text x="591" y="1032" fill="#edf5fa" font-size="21" font-weight="400">Continue → confirm save</text><text x="591" y="1057" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><path d="M576,643 H576 V1063" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M556,562 H556 V1070" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M537,1097 H546 V1097" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="1105" fill="#40d9e7" font-size="23" font-weight="600">New Preset</text><path d="M557,1134 H566 V1134" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="1142" fill="#edf5fa" font-size="21" font-weight="400">Choose empty slot</text><path d="M557,1178 H566 V1178" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="1186" fill="#40d9e7" font-size="23" font-weight="600">Preset Preview</text><text x="571" y="1214" fill="#a7bdcc" font-size="17" font-weight="400">Same destination and preservation fields as</text><text x="571" y="1237" fill="#a7bdcc" font-size="17" font-weight="400">Save As New.</text><path d="M577,1261 H586 V1261" fill="none" stroke="#294252" stroke-width="1.5"/><text x="591" y="1269" fill="#edf5fa" font-size="21" font-weight="400">Name</text><text x="591" y="1294" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M577,1320 H586 V1320" fill="none" stroke="#294252" stroke-width="1.5"/><text x="591" y="1328" fill="#40d9e7" font-size="23" font-weight="600">Starting Point</text><path d="M597,1357 H606 V1357" fill="none" stroke="#294252" stroke-width="1.5"/><text x="611" y="1365" fill="#edf5fa" font-size="21" font-weight="400">Current</text><text x="611" y="1390" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M597,1416 H606 V1416" fill="none" stroke="#294252" stroke-width="1.5"/><text x="611" y="1424" fill="#edf5fa" font-size="21" font-weight="400">Effects Off</text><text x="611" y="1449" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="611" y="1467" fill="#a7bdcc" font-size="17" font-weight="400">Bypasses input PEQ and turns</text><text x="611" y="1490" fill="#a7bdcc" font-size="17" font-weight="400">supported effects off; retains output</text><text x="611" y="1513" fill="#a7bdcc" font-size="17" font-weight="400">EQ/XO, routing, wiring and limiter.</text><path d="M596,1353 H596 V1524" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M577,1551 H586 V1551" fill="none" stroke="#294252" stroke-width="1.5"/><text x="591" y="1559" fill="#edf5fa" font-size="21" font-weight="400">Continue → confirm save</text><text x="591" y="1584" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><path d="M576,1257 H576 V1590" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M556,1130 H556 V1597" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M537,1624 H546 V1624" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="1632" fill="#40d9e7" font-size="23" font-weight="600">Rename</text><path d="M557,1661 H566 V1661" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="1669" fill="#edf5fa" font-size="21" font-weight="400">Choose occupied slot</text><path d="M557,1705 H566 V1705" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="1713" fill="#edf5fa" font-size="21" font-weight="400">Name</text><text x="571" y="1738" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M557,1764 H566 V1764" fill="none" stroke="#294252" stroke-width="1.5"/><text x="571" y="1772" fill="#edf5fa" font-size="21" font-weight="400">Continue → confirm rename</text><text x="571" y="1797" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><path d="M556,1657 H556 V1803" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M537,1830 H546 V1830" fill="none" stroke="#294252" stroke-width="1.5"/><text x="551" y="1838" fill="#edf5fa" font-size="21" font-weight="400">Revert</text><text x="551" y="1863" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><text x="551" y="1881" fill="#a7bdcc" font-size="17" font-weight="400">Reload the active saved preset.</text><path d="M536,443 H536 V1892" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M516,211 H516 V1899" fill="none" stroke="#294252" stroke-width="1.5"/><text x="955" y="186" fill="#40d9e7" font-size="23" font-weight="600">Shared editors</text><path d="M961,215 H970 V215" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="223" fill="#40d9e7" font-size="23" font-weight="600">Numeric editor</text><text x="975" y="251" fill="#a7bdcc" font-size="17" font-weight="400">Gain controls in Outputs/EQ support 0.01 dB.</text><path d="M981,275 H990 V275" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="283" fill="#edf5fa" font-size="21" font-weight="400">Value</text><text x="995" y="308" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="995" y="326" fill="#a7bdcc" font-size="17" font-weight="400">Move across digits, then adjust the selected</text><text x="995" y="349" fill="#a7bdcc" font-size="17" font-weight="400">digit.</text><path d="M981,380 H990 V380" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="388" fill="#edf5fa" font-size="21" font-weight="400">Digit</text><text x="995" y="413" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><text x="995" y="431" fill="#a7bdcc" font-size="17" font-weight="400">Select the adjustment place.</text><path d="M981,462 H990 V462" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="470" fill="#edf5fa" font-size="21" font-weight="400">Apply</text><path d="M981,506 H990 V506" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="514" fill="#edf5fa" font-size="21" font-weight="400">Cancel</text><path d="M980,271 H980 V530" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M961,557 H970 V557" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="565" fill="#40d9e7" font-size="23" font-weight="600">Name editor</text><path d="M981,594 H990 V594" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="602" fill="#edf5fa" font-size="21" font-weight="400">Name</text><text x="995" y="627" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M981,653 H990 V653" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="661" fill="#edf5fa" font-size="21" font-weight="400">Position</text><text x="995" y="686" fill="#40d9e7" font-size="11" font-weight="600">EDIT</text><path d="M981,712 H990 V712" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="720" fill="#edf5fa" font-size="21" font-weight="400">Save Name</text><path d="M981,756 H990 V756" fill="none" stroke="#294252" stroke-width="1.5"/><text x="995" y="764" fill="#edf5fa" font-size="21" font-weight="400">Cancel</text><path d="M980,590 H980 V780" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M960,211 H960 V787" fill="none" stroke="#294252" stroke-width="1.5"/><text x="955" y="838" fill="#40d9e7" font-size="23" font-weight="600">Confirmation screens</text><path d="M961,867 H970 V867" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="875" fill="#edf5fa" font-size="21" font-weight="400">Current / Proposed</text><text x="975" y="900" fill="#40d9e7" font-size="11" font-weight="600">READ</text><text x="975" y="918" fill="#a7bdcc" font-size="17" font-weight="400">Or action-specific source/destination or</text><text x="975" y="941" fill="#a7bdcc" font-size="17" font-weight="400">Left/Right gains.</text><path d="M961,972 H970 V972" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="980" fill="#edf5fa" font-size="21" font-weight="400">No – Cancel</text><text x="975" y="1008" fill="#a7bdcc" font-size="17" font-weight="400">Default selection; Back also cancels.</text><path d="M961,1039 H970 V1039" fill="none" stroke="#294252" stroke-width="1.5"/><text x="975" y="1047" fill="#edf5fa" font-size="21" font-weight="400">Yes – Apply</text><text x="975" y="1072" fill="#40d9e7" font-size="11" font-weight="600">CONFIRM</text><text x="975" y="1090" fill="#a7bdcc" font-size="17" font-weight="400">Action-specific Save/Copy text is used where</text><text x="975" y="1113" fill="#a7bdcc" font-size="17" font-weight="400">appropriate.</text><path d="M960,863 H960 V1124" fill="none" stroke="#294252" stroke-width="1.5"/><path d="M48,1967 H1352 V1967" fill="none" stroke="#294252" stroke-width="1.5"/><text x="48" y="1993" fill="#a7bdcc" font-size="16" font-weight="400">Music, source availability and preset actions are contextual; placeholder/status rows are not additional features.</text></svg>