ght="600">DISPLAY SHORTCUT</text><text x="48" y="790" fill="#edf5fa" font-size="26" font-weight="600">Home / Analog VU / Spectrum</text><text x="48" y="821" fill="#a7bdcc" font-size="19" font-weight="400">VU meter action cycles the displays; Screen Settings also controls idle displays.</text><text x="48" y="866" fill="#40d9e7" font-size="15" font-weight="600">READ THE MAP</text><text x="48" y="899" fill="#edf5fa" font-size="18" font-weight="400">Connected branches open menus. EDIT = change a value. READ = information. CONFIRM = deliberate action.</text><path d="M48,932 H1352 V932" fill="none" stroke="#294252" stroke-width="1.5"/><text x="48" y="958" fill="#a7bdcc" font-size="16" font-weight="400">Reference: v1.4.0 firmware, 18 October 2026. Hardware-dependent rows and contextual screens are marked in the detail sheets.</text></svg>